name: .NET CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ManufacturingManagementSystem.slnx

      - name: Build solution
        run: dotnet build ManufacturingManagementSystem.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test ManufacturingManagementSystem.slnx --no-build --no-restore --configuration Release
